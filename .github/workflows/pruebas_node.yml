name: Pruebas Automaticas

on:
  push:
    branches:
      - main
      - develop
      - release

jobs:
  testear-codigo-js:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4

      - name: Configurar JS
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Instalar las Dependencias
        run: npm install

      - name: Ejecutar Pruebas
        run: npm test
